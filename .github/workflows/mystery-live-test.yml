name: Telegram Mystery Live Test

on:
  workflow_dispatch:
    inputs:
      case_index:
        description: 'Case Index from Curated Seeds (0: Locked Conservatory, 1: Alchemist Crypt, 2: Clockwork Automaton)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
      selected_choice:
        description: 'Simulated Audience Choice Index (0: Lead A, 1: Lead B, 2: Lead C)'
        required: false
        default: '1'
        type: choice
        options:
          - '0'
          - '1'
          - '2'

permissions:
  contents: read

jobs:
  run-live-mystery-test:
    name: Run Live Mystery Publishing Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Test Suite
        run: npm test

      - name: Execute Live Mystery Telegram Publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          echo "🚀 Starting Live Telegram Mystery Publishing Test..."
          npm run mystery:live-test

      - name: Upload Live Test Inspection Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mystery-test-report
          path: |
            live-test-report.json
            data/live-test/
          if-no-files-found: ignore
          retention-days: 7
