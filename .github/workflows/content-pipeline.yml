name: Telegram Interactive Dilemmas Content Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline Action'
        required: true
        default: 'dry_run'
        options:
          - dry_run
          - generate_posts
          - publish_next
          - generate_and_publish
          - test_only
        type: choice
      count:
        description: 'Number of posts to generate (for generate_posts)'
        required: false
        default: '2'
        type: string
      category:
        description: 'Optional Dilemma Category'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'money/lifestyle'
          - 'moral'
          - 'social/relationship'
          - 'strategy'
          - 'survival'
          - 'funny/chaotic'
          - 'technology/future'
          - 'adventure/travel'
          - 'fantasy'
          - 'bizarre hypothetical situations'

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Interactive Dilemmas Pipeline Runner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Execute Content Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          
          if [ -z "$ACTION" ]; then
            ACTION="dry_run"
          fi
          
          echo "Executing pipeline action: $ACTION"
          
          case "$ACTION" in
            "dry_run")
              npx tsx src/pipeline/cli.ts generate-and-publish --dry-run
              ;;
            "generate_posts")
              COUNT="${{ github.event.inputs.count }}"
              CATEGORY="${{ github.event.inputs.category }}"
              ARGS="--count ${COUNT:-2}"
              if [ -n "$CATEGORY" ]; then
                ARGS="$ARGS --category \"$CATEGORY\""
              fi
              eval "npx tsx src/pipeline/cli.ts generate $ARGS"
              ;;
            "publish_next")
              npx tsx src/pipeline/cli.ts publish
              ;;
            "generate_and_publish")
              CATEGORY="${{ github.event.inputs.category }}"
              ARGS=""
              if [ -n "$CATEGORY" ]; then
                ARGS="--category \"$CATEGORY\""
              fi
              eval "npx tsx src/pipeline/cli.ts generate-and-publish $ARGS"
              ;;
            "test_only")
              echo "Tests completed successfully."
              ;;
            *)
              echo "Unknown action: $ACTION"
              exit 1
              ;;
          esac

      - name: Persist Content Queue & Memory
        if: github.event.inputs.action != 'dry_run' && github.event.inputs.action != 'test_only'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(content): update content queue and publication memory [skip ci]"
            git push
          else
            echo "No changes in content queue or memory to commit."
          fi

