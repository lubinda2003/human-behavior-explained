name: Telegram Psychology Content Automation

on:
  schedule:
    # 2 posts per day: 09:00 UTC and 17:00 UTC
    # Adjust cron schedule as needed (e.g. '0 8,16 * * *' for 8 AM / 4 PM UTC)
    - cron: '0 9,17 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline Action'
        required: true
        default: 'publish_next'
        type: choice
        options:
          - publish_next
          - generate_posts
          - generate_and_publish
          - dry_run
          - test_only
      count:
        description: 'Number of posts to generate (for generate_posts)'
        required: false
        default: '2'
        type: string
      force_pillar:
        description: 'Optional Pillar override'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'Everyday Psychology'
          - 'Strange Human Behavior'
          - 'Brain, Memory & Perception'
          - 'Psychology Thought Experiments'

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Content Pipeline Runner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Execute Content Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          
          # Default to publish_next when triggered via cron schedule
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "$ACTION" ]; then
            ACTION="publish_next"
          fi
          
          echo "Executing pipeline action: $ACTION"
          
          case "$ACTION" in
            "publish_next")
              npx tsx src/pipeline/cli.ts publish
              ;;
            "generate_posts")
              COUNT="${{ github.event.inputs.count }}"
              PILLAR="${{ github.event.inputs.force_pillar }}"
              ARGS="--count ${COUNT:-2}"
              if [ -n "$PILLAR" ]; then
                ARGS="$ARGS --pillar \"$PILLAR\""
              fi
              eval "npx tsx src/pipeline/cli.ts generate $ARGS"
              ;;
            "generate_and_publish")
              PILLAR="${{ github.event.inputs.force_pillar }}"
              ARGS=""
              if [ -n "$PILLAR" ]; then
                ARGS="--pillar \"$PILLAR\""
              fi
              eval "npx tsx src/pipeline/cli.ts generate-and-publish $ARGS"
              ;;
            "dry_run")
              npx tsx src/pipeline/cli.ts generate-and-publish --dry-run
              ;;
            "test_only")
              echo "Tests completed successfully."
              ;;
            *)
              echo "Unknown action: $ACTION"
              exit 1
              ;;
          esac

      - name: Persist Content Queue & Memory
        if: github.event.inputs.action != 'dry_run' && github.event.inputs.action != 'test_only'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(content): update content queue and publication memory [skip ci]"
            git push
          else
            echo "No changes in content queue or memory to commit."
          fi
